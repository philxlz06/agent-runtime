services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "agent_runtime.worker"]
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
