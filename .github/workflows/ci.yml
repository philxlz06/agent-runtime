name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests (CI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: ~/.local/bin/uv sync --frozen
      - name: Run tests
        run: ~/.local/bin/uv run pytest -v

  deploy:
    name: Deploy (CD)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Deploy over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
                    ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ubuntu@${{ secrets.DEPLOY_HOST }} 'cd ~/agent-runtime && git pull && docker compose -f compose.prod.yaml up -d --build'
      - name: Check the site is healthy
        run: |
          sleep 15
          curl -fsS https://runtime.philx.dev/health
